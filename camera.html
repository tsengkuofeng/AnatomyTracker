<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatomyTracker - 手機端</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 設定卡片 */
        .setup-card {
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 20px;
            margin: 20px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            min-width: 300px;
            backdrop-filter: blur(10px);
        }

        .setup-card h2 {
            margin-bottom: 20px;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            opacity: 0.8;
        }

        .form-group select {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--primary);
            color: white;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group select option {
            background: #1a1a1a;
            color: white;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 15px;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* 視訊容器 */
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 連線信息 */
        .info-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border-left: 4px solid var(--primary);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 1.5s infinite;
        }

        .status-dot.connected {
            background: #00ff00;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .id-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 8px;
            text-align: right;
            border: 2px solid var(--primary);
            backdrop-filter: blur(10px);
        }

        .id-display .label {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .id-display .id {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary);
            font-family: monospace;
            letter-spacing: 3px;
        }

        .hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        .hint h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .hint p {
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 AnatomyTracker 手機端</h1>
            <p>動作捕捉與關鍵點檢測</p>
        </header>

        <div class="content">
            <!-- 設定卡片 -->
            <div class="setup-card" id="setupPanel">
                <h2>準備開始</h2>

                <div class="form-group">
                    <label>訓練類型</label>
                    <select id="exerciseType">
                        <option value="chest-push">胸推 (Chest Push)</option>
                        <option value="squat">深蹲 (Squat)</option>
                        <option value="deadlift">硬舉 (Deadlift)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>拍攝角度</label>
                    <select id="cameraAngle">
                        <option value="side">側面觀 (Side)</option>
                        <option value="front">正面觀 (Front)</option>
                        <option value="back">背面觀 (Back)</option>
                    </select>
                </div>

                <button class="btn" onclick="startCamera()">🎥 開啟攝像頭</button>
            </div>

            <!-- 視訊區域 -->
            <div class="video-wrapper" id="videoWrapper" style="display: none;">
                <video id="localVideo" autoplay muted playsinline></video>
                <canvas id="output_canvas"></canvas>

                <!-- 連線信息 -->
                <div class="info-overlay">
                    <div class="info-item">
                        <span class="status-dot" id="statusDot"></span>
                        <span id="statusText">啟動中...</span>
                    </div>
                    <div class="info-item">
                        <span>🎯 節點檢測中</span>
                    </div>
                    <div class="info-item">
                        <span>📡 等待連線...</span>
                    </div>
                </div>

                <!-- ID 顯示 -->
                <div class="id-display" id="idDisplay" style="display: none;">
                    <div class="label">你的 ID</div>
                    <div class="id" id="peerId">...</div>
                </div>

                <!-- 提示文字 -->
                <div class="hint" id="hint">
                    <h3>正在初始化...</h3>
                    <p>請稍候</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let peer;
        let localStream;
        let currentCall = null;
        let dataConn = null;

        function generateShortId() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        function initPeer() {
            const shortId = generateShortId();
            peer = new Peer(shortId, {
            host: '0.peerjs.com',
            port: 443,
            secure: true,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });

            peer.on('open', (id) => {
                console.log('手機端 Peer ID: ' + id);
                document.getElementById('peerId').textContent = id;
                document.getElementById('idDisplay').style.display = 'block';
                updateHint('等待電腦連線', '將 ID 輸入到電腦的演講模式');
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    peer.destroy();
                    setTimeout(initPeer, 200);
                } else {
                    console.error("Peer 錯誤:", err);
                    updateStatus('連線錯誤', false);
                }
            });

            peer.on('connection', (conn) => {
                dataConn = conn;
                console.log("電腦已連接");
                updateStatus('已連線至電腦', true);
                updateHint('🎉 連線成功', '開始做動作吧！');

                if(localStream) {
                    currentCall = peer.call(conn.peer, localStream);
                }
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                currentCall = call;
                updateStatus('已連線至電腦', true);
            });
        }

        async function startCamera() {
            const setupPanel = document.getElementById('setupPanel');
            const videoWrapper = document.getElementById('videoWrapper');
            const statusDot = document.getElementById('statusDot');

            setupPanel.style.display = 'none';
            videoWrapper.style.display = 'block';

            updateStatus('正在請求相機權限...', false);
            updateHint('正在初始化...', '請稍候');

            try {
                const constraints = {
                    video: {
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);

                const videoEl = document.getElementById('localVideo');
                videoEl.srcObject = localStream;

                updateStatus('相機就緒，初始化中...', false);
                updateHint('初始化 MediaPipe...', '');

                // 初始化 MediaPipe Pose
                await initPoseDetection();

                // 初始化 PeerJS
                updateStatus('等待電腦連線...', false);
                updateHint('正在生成 ID...', '');
                initPeer();

            } catch (err) {
                console.error(err);
                updateStatus('無法開啟相機', false);
                updateHint('❌ 錯誤', '請確認相機權限');
                alert("無法開啟相機，請確認權限設置。");
            }
        }

        function initPoseDetection() {
            return new Promise((resolve, reject) => {
                const videoEl = document.getElementById('localVideo');
                const canvasEl = document.getElementById('output_canvas');

                const pose = new Pose({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
                });

                pose.setOptions({
                    modelComplexity: 1,
                    smoothLandmarks: true,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                pose.onResults((results) => {
                    // 繪製骨骼
                    const ctx = canvasEl.getContext('2d');
                    ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
                    ctx.drawImage(results.image, 0, 0);

                    if (results.poseLandmarks) {
                        drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS,
                            { color: '#667eea', lineWidth: 2 });
                        drawLandmarks(ctx, results.poseLandmarks,
                            { color: '#ff6b6b', radius: 3 });

                        // 傳送姿勢數據給電腦
                        if (dataConn && dataConn.open) {
                            dataConn.send({
                                type: 'pose',
                                landmarks: results.poseLandmarks
                            });
                        }
                    }
                });

                async function detectFrame() {
                    if (videoEl.videoWidth > 0) {
                        canvasEl.width = videoEl.videoWidth;
                        canvasEl.height = videoEl.videoHeight;
                        await pose.send({ image: videoEl });
                    }
                    requestAnimationFrame(detectFrame);
                }

                videoEl.onloadedmetadata = () => {
                    console.log("視訊已加載");
                    updateStatus('姿勢檢測就緒', false);
                    updateHint('準備完成！', '等待電腦連線...');
                    resolve();
                    detectFrame();
                };

                videoEl.onerror = () => {
                    reject(new Error("視訊加載失敗"));
                };
            });
        }

        function updateStatus(text, connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            statusText.textContent = text;
            if (connected) {
                statusDot.classList.add('connected');
            } else {
                statusDot.classList.remove('connected');
            }
        }

        function updateHint(title, subtitle) {
            const hint = document.getElementById('hint');
            hint.innerHTML = `<h3>${title}</h3><p>${subtitle}</p>`;
        }
    </script>
</body>
</html>
