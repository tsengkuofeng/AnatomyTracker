<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatomyTracker - 鏡頭端</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>
        :root {
            --bg-color: #FAF9F6;
            --accent-color: #800020;
            --text-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h2 {
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            box-sizing: border-box;
            border-top: 4px solid var(--accent-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #555;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: #fff;
            outline: none;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #id-container {
            display: none;
        }

        .big-id {
            font-size: 48px;
            color: var(--accent-color);
            font-weight: 800;
            letter-spacing: 8px;
            margin: 20px 0;
            background: #f4f4f4;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-family: monospace;
        }

        .video-container {
            position: relative;
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
            display: block;
        }

        output_canvas {
            width: 100%;
            display: block;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #eee;
            border-radius: 20px;
            font-size: 13px;
            color: #666;
            margin-top: 10px;
            font-weight: 500;
        }

        .status-badge.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .footer-info {
            font-size: 12px;
            color: #999;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <h2>📱 AnatomyTracker 鏡頭端</h2>

    <div class="card" id="settings-card">
        <div class="form-group">
            <label>1. 訓練類型</label>
            <select id="exercise-type">
                <option value="squat">深蹲 (Squat)</option>
                <option value="deadlift">硬舉 (Deadlift)</option>
                <option value="pushup">伏地挺身 (Pushup)</option>
                <option value="pullup">引體向上 (Pullup)</option>
            </select>
        </div>
        <div class="form-group">
            <label>2. 拍攝角度</label>
            <select id="camera-angle">
                <option value="side">側面觀 (Side View)</option>
                <option value="back">背面觀 (Back View)</option>
                <option value="front">正面觀 (Front View)</option>
            </select>
        </div>
        <button onclick="initCamera()">🎥 啟動鏡頭</button>
    </div>

    <div class="card" id="id-container">
        <label>請將此 ID 輸入至電腦端：</label>
        <div class="big-id" id="my-peer-id">...</div>
        <div class="status-badge" id="conn-status">啟動中...</div>

        <div class="video-container">
            <video id="localVideo" autoplay muted playsinline></video>
            <canvas id="output_canvas" style="position:absolute; top:0; left:0; width:100%; display:none;"></canvas>
        </div>

        <p style="font-size:12px; color:#888; margin-top:15px; text-align:center;">
            ✓ 鏡頭已開啟<br>
            ✓ 節點檢測中<br>
            請保持手機開啟
        </p>
    </div>

    <div class="footer-info">&copy; 2026 AnatomyTracker - 鏡頭端</div>

    <script>
        let peer;
        let localStream;
        let currentCall = null;
        let pose = null;

        function generateShortId() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        function initPeer() {
            const shortId = generateShortId();
            peer = new Peer(shortId);

            peer.on('open', (id) => {
                document.getElementById('my-peer-id').innerText = id;
                document.getElementById('conn-status').innerText = "等待電腦連線...";
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    peer.destroy();
                    setTimeout(initPeer, 200);
                } else {
                    alert("連線錯誤: " + err.type);
                }
            });

            peer.on('connection', (conn) => {
                const badge = document.getElementById('conn-status');
                badge.innerText = "✅ 已連線至監控台";
                badge.classList.add('connected');

                if(localStream) {
                    currentCall = peer.call(conn.peer, localStream);
                }
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                currentCall = call;
            });
        }

        async function initCamera() {
            const settingsCard = document.getElementById('settings-card');
            const idContainer = document.getElementById('id-container');
            const statusBadge = document.getElementById('conn-status');

            settingsCard.style.display = 'none';
            idContainer.style.display = 'block';
            statusBadge.innerText = "正在請求相機權限...";

            try {
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);

                const videoEl = document.getElementById('localVideo');
                videoEl.srcObject = localStream;

                statusBadge.innerText = "相機就緒，正在獲取 ID...";

                // 初始化 MediaPipe Pose
                initPoseDetection();

                // 初始化 PeerJS
                initPeer();

            } catch (err) {
                console.error(err);
                alert("無法開啟相機，請確認權限。");
            }
        }

        function initPoseDetection() {
            const videoEl = document.getElementById('localVideo');
            const canvasEl = document.getElementById('output_canvas');

            pose = new Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
            });

            pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            pose.onResults((results) => {
                // 可以在這裡進行骨骼繪製
                // drawSkeleton(canvasEl, results);
            });

            async function detectFrame() {
                if (videoEl.videoWidth > 0) {
                    canvasEl.width = videoEl.videoWidth;
                    canvasEl.height = videoEl.videoHeight;
                    await pose.send({ image: videoEl });
                }
                requestAnimationFrame(detectFrame);
            }

            detectFrame();
        }
    </script>
</body>
</html>
