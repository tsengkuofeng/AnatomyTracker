<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatomyTracker - 解剖模型動作追蹤</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>
        :root {
            --bg-color: #FAF9F6;
            --accent-color: #800020;
            --text-color: #333333;
            --gray-light: #E0E0E0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--gray-light);
            background: white;
            z-index: 10;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-weight: 700;
            color: var(--text-color);
            font-size: 28px;
        }

        .subtitle {
            color: var(--accent-color);
            font-size: 12px;
            margin-top: 5px;
        }

        .main-container {
            flex: 1;
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
            gap: 2px;
            background: #000;
        }

        /* 左側：3D 解剖模型 */
        #canvas-3d {
            flex: 1;
            background: #34495e;
        }

        /* 右側：動作信息 + 連線設定 */
        #control-panel {
            width: 350px;
            background: white;
            border-left: 1px solid var(--gray-light);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            gap: 20px;
        }

        .panel-section {
            border-bottom: 1px solid var(--gray-light);
            padding-bottom: 15px;
        }

        .panel-section:last-child {
            border-bottom: none;
        }

        .panel-section h3 {
            color: var(--accent-color);
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .info-item {
            font-size: 12px;
            margin: 8px 0;
            padding: 8px;
            background: var(--bg-color);
            border-radius: 4px;
            border-left: 3px solid var(--accent-color);
        }

        .info-label {
            font-weight: bold;
            color: #555;
        }

        .info-value {
            color: var(--accent-color);
            font-weight: 600;
        }

        .input-group {
            margin: 10px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: bold;
            color: #666;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: var(--bg-color);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        .btn-secondary:hover {
            background-color: #f0f0f0;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #eee;
            border-radius: 12px;
            font-size: 11px;
            color: #666;
            font-weight: 600;
            margin-top: 5px;
        }

        .status-badge.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-badge.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .joint-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 11px;
        }

        .joint-item {
            background: var(--bg-color);
            padding: 8px;
            border-radius: 4px;
            text-align: center;
        }

        .joint-name {
            font-weight: bold;
            color: #555;
            margin-bottom: 3px;
        }

        .joint-value {
            color: var(--accent-color);
            font-weight: 600;
        }

        @media (max-width: 1024px) {
            #control-panel {
                width: 300px;
                padding: 15px;
            }

            .joint-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🧬 AnatomyTracker</h1>
        <div class="subtitle">3D 解剖模型實時動作追蹤</div>
    </header>

    <div class="main-container">
        <!-- 左側：3D Canvas -->
        <canvas id="canvas-3d"></canvas>

        <!-- 右側：控制面板 -->
        <div id="control-panel">

            <!-- 連線設定 -->
            <div class="panel-section">
                <h3>📱 連線設定</h3>
                <div class="input-group">
                    <label>手機 ID</label>
                    <input type="text" id="phone-id" placeholder="輸入手機 4 位數 ID">
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="connectPhone()">連線</button>
                    <button class="btn btn-secondary" onclick="disconnectPhone()">斷開</button>
                </div>
                <div id="connection-status">
                    <span class="status-badge disconnected">未連線</span>
                </div>
            </div>

            <!-- 系統狀態 -->
            <div class="panel-section">
                <h3>📊 系統狀態</h3>
                <div class="info-item">
                    <span class="info-label">FPS:</span>
                    <span class="info-value" id="fps">0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">檢測節點:</span>
                    <span class="info-value" id="detected-joints">0/33</span>
                </div>
                <div class="info-item">
                    <span class="info-label">模型狀態:</span>
                    <span class="info-value" id="model-status">載入中...</span>
                </div>
            </div>

            <!-- 主要關節信息 -->
            <div class="panel-section">
                <h3>🦴 關節位置</h3>
                <div class="joint-info" id="joint-display">
                    <div class="joint-item">
                        <div class="joint-name">肩膀 L</div>
                        <div class="joint-value">-</div>
                    </div>
                    <div class="joint-item">
                        <div class="joint-name">肩膀 R</div>
                        <div class="joint-value">-</div>
                    </div>
                    <div class="joint-item">
                        <div class="joint-name">肘 L</div>
                        <div class="joint-value">-</div>
                    </div>
                    <div class="joint-item">
                        <div class="joint-name">肘 R</div>
                        <div class="joint-value">-</div>
                    </div>
                    <div class="joint-item">
                        <div class="joint-name">腰 L</div>
                        <div class="joint-value">-</div>
                    </div>
                    <div class="joint-item">
                        <div class="joint-name">腰 R</div>
                        <div class="joint-value">-</div>
                    </div>
                    <div class="joint-item">
                        <div class="joint-name">膝 L</div>
                        <div class="joint-value">-</div>
                    </div>
                    <div class="joint-item">
                        <div class="joint-name">膝 R</div>
                        <div class="joint-value">-</div>
                    </div>
                </div>
            </div>

            <!-- 動作信息 -->
            <div class="panel-section">
                <h3>🏃 動作分析</h3>
                <div class="info-item">
                    <span class="info-label">當前動作:</span>
                    <span class="info-value" id="current-motion">靜止</span>
                </div>
                <div class="info-item">
                    <span class="info-label">動作速度:</span>
                    <span class="info-value" id="motion-speed">0</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ========== 全局變數 ==========
        let myPeer = new Peer();
        let scene, camera, renderer;
        let modelAnimator = null;
        let fpsCounter = { fps: 0, frameCount: 0, lastTime: performance.now() };
        let lastPoseData = null;
        let isConnected = false;

        // ========== Three.js 初始化 ==========
        function initThreeJS() {
            const canvas = document.getElementById('canvas-3d');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x34495e);

            const width = canvas.clientWidth;
            const height = canvas.clientHeight;

            camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);

            // 燈光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            // 加載模型
            loadModel();

            // 動畫循環
            animate();

            window.addEventListener('resize', onWindowResize);
        }

        // ========== 加載 3D 模型 ==========
        function loadModel() {
            console.log("開始加載模型...");

            if (typeof THREE.GLTFLoader === 'undefined') {
                console.error("THREE.GLTFLoader 未定義");
                updateModelStatus("GLTFLoader 加載失敗");
                return;
            }

            const loader = new THREE.GLTFLoader();

            loader.load(
                'models/pec.glb',
                (gltf) => {
                    console.log("模型加載成功!");
                    const model = gltf.scene;

                    // 調整模型大小和位置
                    const box = new THREE.Box3().setFromObject(model);
                    const size = box.getSize(new THREE.Vector3());
                    const center = box.getCenter(new THREE.Vector3());

                    model.position.sub(center);
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 4 / maxDim;
                    model.scale.multiplyScalar(scale);

                    scene.add(model);

                    modelAnimator = {
                        model: model,
                        bones: {},
                        isLoaded: true
                    };

                    model.traverse((node) => {
                        if (node.isBone) {
                            modelAnimator.bones[node.name] = node;
                        }
                    });

                    updateModelStatus("✓ 模型已加載");
                },
                (progress) => {
                    const percent = (progress.loaded / progress.total * 100).toFixed(0);
                    updateModelStatus(`📦 加載中: ${percent}%`);
                },
                (error) => {
                    console.error('模型加載失敗:', error);
                    updateModelStatus("✗ 加載失敗");
                }
            );
        }

        // ========== 連線到手機 ==========
        function connectPhone() {
            const phoneId = document.getElementById('phone-id').value.trim();
            if (!phoneId) {
                alert("請輸入手機 ID");
                return;
            }

            console.log(`嘗試連線到: ${phoneId}`);
            updateConnectionStatus('正在連線...', 'pending');

            const conn = myPeer.connect(phoneId);

            conn.on('open', () => {
                console.log("數據連線已建立");
                updateConnectionStatus('已連線', 'connected');
            });

            conn.on('error', (err) => {
                console.error("連線錯誤:", err);
                updateConnectionStatus('連線失敗', 'disconnected');
            });

            myPeer.on('call', (call) => {
                if (call.peer === phoneId && !isConnected) {
                    console.log("收到視訊呼叫");
                    call.answer();
                    call.on('stream', (stream) => {
                        console.log("收到姿勢數據");
                        isConnected = true;
                    });
                    isConnected = true;
                }
            });
        }

        function disconnectPhone() {
            isConnected = false;
            updateConnectionStatus('未連線', 'disconnected');
            console.log("已斷開連線");
        }

        function updateConnectionStatus(text, status) {
            const statusEl = document.getElementById('connection-status');
            const badgeClass = status === 'connected' ? 'connected' : status === 'pending' ? '' : 'disconnected';
            statusEl.innerHTML = `<span class="status-badge ${badgeClass}">${text}</span>`;
        }

        function updateModelStatus(text) {
            document.getElementById('model-status').textContent = text;
        }

        // ========== 更新關節信息 ==========
        function updateJointDisplay(pose) {
            if (!pose) return;

            const POSE_LANDMARKS = {
                LEFT_SHOULDER: 11,
                RIGHT_SHOULDER: 12,
                LEFT_ELBOW: 13,
                RIGHT_ELBOW: 14,
                LEFT_HIP: 23,
                RIGHT_HIP: 24,
                LEFT_KNEE: 25,
                RIGHT_KNEE: 26,
            };

            const landmarks = {
                '肩膀 L': pose[POSE_LANDMARKS.LEFT_SHOULDER],
                '肩膀 R': pose[POSE_LANDMARKS.RIGHT_SHOULDER],
                '肘 L': pose[POSE_LANDMARKS.LEFT_ELBOW],
                '肘 R': pose[POSE_LANDMARKS.RIGHT_ELBOW],
                '腰 L': pose[POSE_LANDMARKS.LEFT_HIP],
                '腰 R': pose[POSE_LANDMARKS.RIGHT_HIP],
                '膝 L': pose[POSE_LANDMARKS.LEFT_KNEE],
                '膝 R': pose[POSE_LANDMARKS.RIGHT_KNEE],
            };

            const jointDisplay = document.getElementById('joint-display');
            let html = '';

            Object.entries(landmarks).forEach(([name, landmark]) => {
                const value = landmark ? `(${landmark.x.toFixed(2)}, ${landmark.y.toFixed(2)})` : '-';
                html += `
                    <div class="joint-item">
                        <div class="joint-name">${name}</div>
                        <div class="joint-value">${value}</div>
                    </div>
                `;
            });

            jointDisplay.innerHTML = html;
            document.getElementById('detected-joints').textContent = `${Object.keys(pose).length}/33`;
        }

        // ========== 動畫循環 ==========
        function animate() {
            requestAnimationFrame(animate);

            // 更新 FPS
            fpsCounter.frameCount++;
            const currentTime = performance.now();
            if (currentTime - fpsCounter.lastTime >= 1000) {
                fpsCounter.fps = fpsCounter.frameCount;
                fpsCounter.frameCount = 0;
                fpsCounter.lastTime = currentTime;
                document.getElementById('fps').textContent = fpsCounter.fps;
            }

            // 旋轉模型
            if (modelAnimator && modelAnimator.model) {
                modelAnimator.model.rotation.y += 0.002;

                // 應用姿勢數據
                if (lastPoseData) {
                    updateJointDisplay(lastPoseData);
                    applyPoseToModel(lastPoseData);
                }
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function applyPoseToModel(pose) {
            if (!modelAnimator || !modelAnimator.isLoaded) return;

            // 這裡可以添加骨骼動畫邏輯
            // 根據 pose 數據旋轉骨骼
        }

        function onWindowResize() {
            const canvas = document.getElementById('canvas-3d');
            if (!canvas || !renderer || !camera) return;

            const width = canvas.clientWidth;
            const height = canvas.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        // 記錄 PeerJS 連接事件
        myPeer.on('open', (id) => {
            console.log('監控端 Peer ID: ' + id);
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initThreeJS();
        });
    </script>
</body>
</html>
