<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatomyTracker - 選擇動作</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
    <script src="js/exercises.js"></script>
</head>
<body>
    <header>
        <h1>🧬 AnatomyTracker</h1>
        <div class="subtitle">選擇要追蹤的動作</div>
    </header>

    <div class="container">
        <!-- 分類標籤 -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="filterByCategory('all')">全部</button>
            <button class="tab-btn" onclick="filterByCategory('chest')">胸部</button>
            <button class="tab-btn" onclick="filterByCategory('back')">背部</button>
            <button class="tab-btn" onclick="filterByCategory('legs')">腿部</button>
        </div>

        <!-- 動作卡片網格 -->
        <div class="exercises-grid" id="exercisesGrid"></div>
    </div>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: "Helvetica Neue", Arial, sans-serif;
            color: #333;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            color: white;
        }

        header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 分類標籤 */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
        }

        /* 卡片網格 */
        .exercises-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        /* 卡片樣式 */
        .exercise-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .exercise-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .card-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            position: relative;
            overflow: hidden;
        }

        .card-image::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveBackground 20s linear infinite;
        }

        @keyframes moveBackground {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .card-icon {
            font-size: 60px;
            z-index: 1;
        }

        .card-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .card-category {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-description {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            flex: 1;
            line-height: 1.5;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .difficulty {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .difficulty.beginner {
            background: #d4edda;
            color: #155724;
        }

        .difficulty.intermediate {
            background: #fff3cd;
            color: #856404;
        }

        .difficulty.advanced {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            header h1 {
                font-size: 36px;
            }

            .exercises-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        let currentCategory = 'all';

        function renderExercises() {
            const grid = document.getElementById('exercisesGrid');
            grid.innerHTML = '';

            let exercises = getAllExercises();

            if (currentCategory !== 'all') {
                exercises = exercises.filter(e => e.category === currentCategory);
            }

            exercises.forEach(exercise => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                card.onclick = () => startExercise(exercise.id);

                card.innerHTML = `
                    <div class="card-image">
                        <div class="card-icon">${exercise.icon}</div>
                    </div>
                    <div class="card-content">
                        <div class="card-category">${exercise.category}</div>
                        <div class="card-title">${exercise.name}</div>
                        <div class="card-description">${exercise.description}</div>
                        <div class="card-footer">
                            <span class="difficulty ${exercise.difficulty}">${exercise.difficulty}</span>
                            <button class="btn-start">開始 →</button>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function filterByCategory(category) {
            currentCategory = category;

            // 更新按鈕狀態
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            renderExercises();
        }

        function startExercise(exerciseId) {
            // 導向到動作詳情頁
            window.location.href = `exercise.html?id=${exerciseId}`;
        }

        // 頁面載入時渲染
        document.addEventListener('DOMContentLoaded', () => {
            renderExercises();
        });
    </script>
</body>
</html>
