<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatomyTracker - 選擇動作</title>
    <script src="js/exercise.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.8;
            color: #aaa;
        }

        .carousel-container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        .carousel {
            display: flex;
            gap: 30px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 20px 0;
            scroll-padding: 20px;
            /* 隱藏滾動條 */
            scrollbar-width: none;
        }

        .carousel::-webkit-scrollbar {
            display: none;
        }

        .exercise-card {
            flex: 0 0 calc(100% / 3 - 20px);
            min-width: 350px;
            aspect-ratio: 9 / 10;
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid #667eea;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .exercise-card:hover {
            transform: translateY(-20px) scale(1.05);
            border-color: #764ba2;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4);
            background: rgba(102, 126, 234, 0.2);
        }

        .exercise-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(118, 75, 162, 0.3) 0%, transparent 70%);
            transition: all 0.4s;
        }

        .exercise-card:hover::before {
            top: -30%;
            right: -30%;
        }

        .card-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 40px 30px;
        }

        .card-icon {
            font-size: 120px;
            text-align: center;
            margin: 20px 0;
            filter: drop-shadow(0 10px 20px rgba(102, 126, 234, 0.3));
        }

        .card-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #667eea;
        }

        .card-category {
            font-size: 12px;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #aaa;
        }

        .card-description {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.8;
            color: #ddd;
            margin-bottom: 30px;
            flex: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .difficulty {
            font-size: 11px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .difficulty.beginner {
            background: rgba(100, 200, 100, 0.2);
            color: #64c864;
            border: 1px solid #64c864;
        }

        .difficulty.intermediate {
            background: rgba(200, 180, 100, 0.2);
            color: #d4b456;
            border: 1px solid #d4b456;
        }

        .difficulty.advanced {
            background: rgba(200, 100, 100, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .btn-start:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.5);
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* 滾動提示 */
        .scroll-hint {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            opacity: 0.5;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* 響應式 */
        @media (max-width: 1200px) {
            .exercise-card {
                flex: 0 0 calc(100% / 2 - 15px);
                min-width: 300px;
            }

            .card-icon {
                font-size: 100px;
            }

            .card-title {
                font-size: 24px;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 36px;
            }

            .exercise-card {
                flex: 0 0 100%;
                min-width: 100%;
            }

            .card-content {
                padding: 30px 20px;
            }

            .card-icon {
                font-size: 80px;
            }

            .card-title {
                font-size: 22px;
            }
        }

        /* 沒有卡片時的提示 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.6;
        }

        .empty-state p {
            font-size: 18px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧬 AnatomyTracker</h1>
        <p>選擇要演講的動作</p>
    </div>

    <div class="carousel-container">
        <div class="carousel" id="carousel">
            <!-- 動作卡片會動態插入這裡 -->
        </div>
        <div class="scroll-hint">← 滑動查看更多 →</div>
    </div>

    <script>
        function renderExercises() {
            const carousel = document.getElementById('carousel');
            carousel.innerHTML = '';

            const exercises = getAllExercises();

            if (exercises.length === 0) {
                carousel.innerHTML = '<div class="empty-state"><p>暫無動作配置</p></div>';
                return;
            }

            exercises.forEach(exercise => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                card.onclick = () => startExercise(exercise.id);

                card.innerHTML = `
                    <div class="card-content">
                        <div>
                            <div class="card-category">${exercise.category}</div>
                            <div class="card-icon">${exercise.icon}</div>
                            <div class="card-title">${exercise.name}</div>
                            <div class="card-description">${exercise.description}</div>
                        </div>
                        <div class="card-footer">
                            <span class="difficulty ${exercise.difficulty}">${exercise.difficulty}</span>
                            <button class="btn-start">開始 →</button>
                        </div>
                    </div>
                `;

                carousel.appendChild(card);
            });
        }

        function startExercise(exerciseId) {
            // 導向到演講模式
            window.location.href = `presentation.html?id=${exerciseId}`;
        }

        // 頁面載入時渲染
        document.addEventListener('DOMContentLoaded', () => {
            renderExercises();
        });
    </script>
</body>
</html>
